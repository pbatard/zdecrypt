name: Linux

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set version
      id: set_version
      run: |
        git_tag=$(git describe --tags --abbrev=0 || echo v0.0)
        echo "version=$git_tag" >> $GITHUB_OUTPUT

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssl-dev libjson-c-dev

    - name: Build
      run: |
        make CFLAGS=-DAPP_VERSION="${{ steps.set_version.outputs.version }}"
        mv ./zdecrypt ./zdecrypt_linux

    - name: Display SHA-256
      run: sha256sum ./zdecrypt_linux

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'push' }}
      with:
        name: linux
        path: ./zdecrypt_linux

    - name: Upload release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: ./zdecrypt_linux
